spring.application.name=matriculas
server.port=${SERVER_PORT:8080}

# MongoDB Atlas: defina MONGODB_URI como variavel de ambiente (nao versionar credenciais)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/matriculas}

# JWT (HS256): defina JWT_SECRET com pelo menos 32 caracteres. O valor padrao e SOMENTE para desenvolvimento.
app.jwt.secret=${JWT_SECRET:dev-secret-troque-em-producao-0123456789}
app.jwt.expiracao-minutos=120

# Usuario inicial (secretaria), criado se nao existir
app.seed.login=${SEED_LOGIN:secretaria}
app.seed.senha=${SEED_SENHA:secretaria123}

# Origens permitidas no CORS (front-end Vite)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
